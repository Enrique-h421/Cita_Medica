<div class="marco">
  <aside class="lateral">
    <div class="marca">
      <svg class="logo" viewBox="0 0 76 76" width="30" height="30" aria-hidden="true">
        <rect class="placa" width="76" height="76" rx="18" />
        <path class="arco" d="M54.71 18.08 A 26 26 0 1 0 54.71 57.92" />
        <rect class="cruz" x="35.5" y="30" width="5" height="16" rx="2.5" />
        <rect class="cruz" x="30" y="35.5" width="16" height="5" rx="2.5" />
      </svg>
      <span class="nombre-sistema">CitaMedica</span>
    </div>

    <nav class="menu" aria-label="Secciones">
      <a routerLink="/inicio" routerLinkActive="activo">
        <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 8.6 10 3l7 5.6V16a1.4 1.4 0 01-1.4 1.4H4.4A1.4 1.4 0 013 16z" />
          <path d="M7.8 17.4v-5.2h4.4v5.2" />
        </svg>
        <span>Inicio</span>
      </a>

      <a routerLink="/agenda" routerLinkActive="activo">
        <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4.5" width="14" height="12.5" rx="2.5" />
          <path d="M3 8.5h14M7 2.8v3.2M13 2.8v3.2" />
        </svg>
        <span>Agenda</span>
      </a>

      <a routerLink="/pacientes" routerLinkActive="activo">
        <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="10" cy="7" r="3.2" />
          <path d="M4.2 16.6c0-3 2.6-4.8 5.8-4.8s5.8 1.8 5.8 4.8" />
        </svg>
        <span>Pacientes</span>
      </a>

      @if (auth.puedeAtender()) {
        <a routerLink="/expedientes" routerLinkActive="activo">
          <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor"
               stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2.8 6.2a1.8 1.8 0 011.8-1.8h2.9l1.6 2h6.1a1.8 1.8 0 011.8 1.8v6.6a1.8 1.8
                     0 01-1.8 1.8H4.6a1.8 1.8 0 01-1.8-1.8z" />
          </svg>
          <span>Expedientes</span>
        </a>
      }

      @if (auth.esAdministrador()) {
        <a routerLink="/usuarios" routerLinkActive="activo">
          <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor"
               stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="8" cy="7.2" r="2.8" />
            <path d="M2.8 16.3c0-2.7 2.3-4.3 5.2-4.3s5.2 1.6 5.2 4.3" />
            <path d="M14.3 5.2a2.8 2.8 0 010 4.5M15.5 12.5c1.3.6 2 1.8 2 3.3" />
          </svg>
          <span>Usuarios</span>
        </a>
      }
    </nav>

    <div class="sesion">
      <div class="identidad">
        <span class="usuario">{{ auth.nombreParaMostrar() }}</span>
        <span class="rol">{{ auth.rolParaMostrar() }}</span>
      </div>
      <button type="button" class="boton-secundario boton-salir" (click)="auth.cerrarSesion()">
        Salir
      </button>
    </div>
  </aside>

  <main class="contenido">
    <router-outlet />
  </main>
</div>
